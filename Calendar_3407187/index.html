    <title>Calendario de Eventos</title>


<!-- Hojas de estilo -->
<link rel="stylesheet" href="normalize.css">
<link rel="stylesheet" href="styles.css">


</head>

<body>


<!-- ================= HEADER ================= -->
<header class="main-header">

    <div class="main-header__container">

        <!-- Logo -->
        <div class="main-header__logo">
            Mis Eventos
        </div>

        <!-- Botón hamburguesa -->
        <button

            id="menu-toggle"
            aria-label="Abrir menú">

            <div class="main-header__bar"></div>
            <div class="main-header__bar"></div>
            <div class="main-header__bar"></div>
        </button>

        <!-- Navegación -->
        <nav class="main-nav" id="main-nav">

                    <a class="main-nav__link" href="#">

</header>

<!-- ================= CONTENIDO PRINCIPAL ================= -->
<main>

            <option value="7">7</option>

            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
            <option value="16">16</option>
            <option value="17">17</option>
            <option value="18">18</option>
            <option value="19">19</option>
            <option value="20">20</option>
            <option value="21">21</option>

            <option value="24">24</option>

            <option value="26">26</option>
            <option value="27">27</option>
            <option value="28">28</option>
            <option value="29">29</option>
            <option value="30">30</option>
        </select>

        <!-- Nombre -->
        <label for="eventTitle">
            Nombre del evento
        </label>

        <input
            type="text"
            id="eventTitle"
            name="eventTitle"
            placeholder="Nombre del evento">

        <!-- Hora -->
        <label for="eventTime">
            Hora
        </label>

        <input
            type="time"
            id="eventTime"
            name="eventTime">

        <!-- Descripción -->
        <label for="eventDescription">
            Descripción
        </label>

        <textarea
            id="eventDescription"
            name="eventDescription"
            placeholder="Descripción"></textarea>

        <!-- Categoría -->
        <label for="eventIcon">
            Categoría
        </label>

        <select id="eventIcon" name="eventIcon">
            <option value="📚">📚 Estudio</option>
            <option value="💼">💼 Trabajo</option>
            <option value="🎉">🎉 Fiesta</option>
            <option value="⚽">⚽ Deporte</option>
            <option value="🏥">🏥 Salud</option>
            <option value="✈️">✈️ Viaje</option>
            <option value="❤️">❤️ Personal</option>
        </select>

        <!-- Botón -->
        <button id="addEvent">
            Agregar Evento
        </button>

    </section>

    <!-- Calendario -->
    <section class="container">

        <!-- Mes -->
        <div class="month">
            Junio
        </div>

        <!-- Días de la semana -->
        <div class="days">

            <div class="days__item">Mon</div>
            <div class="days__item">Tue</div>
            <div class="days__item">Wed</div>
            <div class="days__item">Thu</div>
            <div class="days__item">Fri</div>
            <div class="days__item">Sat</div>

    </div>

    <div class="schedule__days" data-day="15">

    </div>

    </div>

</div>

</main>

<!-- ================= JAVASCRIPT ================= -->
<script>

    // Menú responsive
    const menuToggle = document.getElementById("menu-toggle");
    const mainNav = document.getElementById("main-nav");

    menuToggle.addEventListener("click", function () {
        mainNav.classList.toggle("main-nav__open");
    });

    // Agregar eventos
    const addEventBtn = document.getElementById("addEvent");

    addEventBtn.addEventListener("click", function () {

        const day = document.getElementById("eventDay").value;
        const title = document.getElementById("eventTitle").value.trim();
        const time = document.getElementById("eventTime").value;
        const description = document.getElementById("eventDescription").value.trim();
        const icon = document.getElementById("eventIcon").value;

        if (!day || !title) {
            alert("Debe ingresar un día y un nombre");
            return;
        }

        const container = document.querySelector(
            `[data-day="${day}"] .events`
        );

        const event = document.createElement("div");
        event.classList.add("event");

        event.innerHTML = `
            <div class="event-title">
                ${icon} ${title}
            </div>

            <div class="event-time">
                ${time || "Sin hora"}
            </div>

            <div class="event-description">
                ${description}
            </div>
        `;

        container.appendChild(event);

        document.getElementById("eventDay").value = "";
        document.getElementById("eventTitle").value = "";
        document.getElementById("eventTime").value = "";
        document.getElementById("eventDescription").value = "";
    });

</script>


</body>

</html>
