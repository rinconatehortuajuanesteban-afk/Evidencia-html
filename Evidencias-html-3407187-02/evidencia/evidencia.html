<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Perfil</title>

    <style>

        @font-face {
            font-family: "Inter";
            src: url(inter/Inter.ttf);
            font-style: normal;
            font-weight: 400;
        }

        @font-face {
            font-family: "Inter";
            src: url(inter/Inter.ttf);
            font-style: normal;
            font-weight: 700;
        }

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-color: #5a22c8;
            font-family: "Inter", sans-serif;
        }

        .card{
            width: 283px;
            height: 557px;
            margin: 10px auto;
            position: relative;
        }

        .card__flag{
            width: 110%;
            height: 100%;
            background-color: #f4a259;
            border-radius: 18px;
            padding: 12px;
        }

        .card__container-image{
            width: auto;
            height: auto;
            background-color: #d9d9d9;
            border-radius: 14px;
            overflow: hidden;
        }

        .card__image{
            width: 100%;
            height: 80%;
            object-fit: cover;
            display: block;
        }

        .card__content{
            width: 110%;
            height: 300px;
            background-color: #424242;
            border-radius: 20px;
            position: absolute;
            bottom: 0;
            left: 0;
            text-align: center;
            padding: 40px 28px;
        }

        .card__nombre{
            color: white;
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .card__descripcion{
            color: white;
            font-size: 15px;
            line-height: 30px;
            font-weight: 400;
            margin-bottom: 35px;
        }

        .card__button{
            display: inline-block;
            width: 95px;
            height: 50px;
            background-color: #f4a259;
            color: white;
            text-decoration: none;
            line-height: 50px;
            border-radius: 5px;
            font-size: 18px;
            font-weight: 700;
        }

        .card__button:hover{
            background-color: #e18d45;
        }

    </style>

</head>
<body>

    <div class="card">

        <div class="card__flag">

            <div class="card__container-image">

                <!-- Cambia imagen.jpg por tu imagen -->
                <img class="card__image" src="adulto-hombre.jpg" alt="Samuel Techton">

            </div>

        </div>

        <div class="card__content">

            <p class="card__nombre">
                Samuel Techton
            </p>

            <p class="card__descripcion">
                Software engineer with a knack
                for problem-solving. I thrive on
                coding challenges and crafting
                elegant solutions.
            </p>

            <a href="#" class="card__button">
                Follow
            </a>

        </div>

    </div>

</body>
</html>
