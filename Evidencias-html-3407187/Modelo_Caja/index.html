<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bordes CSS</title>

    <style>
        .padre {
            background-color: skyblue;
            width: 400px;
            height: 400px;
            padding: 30px;
            border: 10px solid black;
            box-sizing: border-box;
        }

        .hijo {
            background-color: cadetblue;
            width: 200px;
            height: 200px;
            padding: 20px;

            /* Diferentes tipos de borde */
            border-top: 8px solid red;
            border-right: 8px dashed green;
            border-bottom: 8px dotted blue;
            border-left: 8px double purple;

            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="padre">
        <div class="hijo">hijo</div>
    </div>
</body>
</html>
