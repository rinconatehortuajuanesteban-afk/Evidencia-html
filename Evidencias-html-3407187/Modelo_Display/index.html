<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline vs Block</title>
    <style>
        .titulo {
            color: darkred;
            font-size: 20px; 
            background-color: aqua;
            letter-spacing: 3px;
            padding: 5px;
        }

        /* INLINE */
        .menu {
            display: inline;
            background-color: cadetblue;
            color: beige;
            padding: 10px;
            margin-right: 5px;
        } 

        /* BLOCK */
        .menu_block {
            display: block;
            background-color: cadetblue;
            color: beige;
            width: 200px;
            height: 50px;
            margin-bottom: 5px;
            padding: 10px;
        }

        /*  inline-block */
        .menu_inline_block {
            display: inline-block;
            background-color: teal;
            color: white;
            width: 150px;
            height: 50px;
            margin-right: 5px;
            padding: 10px;
        }
    </style>
</head>
<body>

 <h1 class="titulo">Elementos Inline</h1>  
 <div class="menu">productos</div>
 <div class="menu">servicios</div>
 <div class="menu">contactos</div>

 <hr>

 <h1 class="titulo">Elementos Block</h1>
 <div class="menu_block">productos</div>
 <div class="menu_block">servicios</div>
 <div class="menu_block">contactos</div>

 <hr>

 <h1 class="titulo">Inline-Block</h1>
 <div class="menu_inline_block">productos</div>
 <div class="menu_inline_block">servicios</div>
 <div class="menu_inline_block">contactos</div>

</body>
</html>
